# Builds and tests the Windows (x64) app, and can attach its installer to a release.
#   push to windows-port            build and test; the installer is a workflow artifact
#   Run workflow, release_tag v1.5.0  also uploads the installer to that release
name: Windows

on:
  push:
    branches: [windows-port]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release to attach the installer to, e.g. v1.5.0 (empty to only build)
        required: false
        default: ''

# the build runs third-party code (npm install scripts, node-gyp, crates' build scripts), so it can only read;
# the attach job, which runs none of it, is the only one that can write to a release
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      # the dictionaries and templates ship as they are in the repo, with LF line endings
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # the whole history, so the rollback test finds 1.10.4's commit rather than skipping
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      # rustup comes with the runner
      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: npm ci

      # Visual Studio's C++ tools and Python come with the runner. Without the Hunspell binding the
      # installer still builds (no spell checker), but a release run fails instead of attaching it.
      - name: Spell checker (Hunspell)
        continue-on-error: ${{ !inputs.release_tag }}
        run: node scripts/native.mjs hunspell

      # built from its tagged source with the C runtime linked in, which takes a while, so kept between runs: saved as
      # soon as it's built, as the whole cache action saves only when every later step passes
      - id: texlab-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\spectrum-build\texlab-5.26.0-x64
          key: texlab-5.26.0-x64-crt-static

      - name: TexLab
        run: node scripts/desktop.mjs texlab

      - if: steps.texlab-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\spectrum-build\texlab-5.26.0-x64
          key: texlab-5.26.0-x64-crt-static

      - name: Installer
        run: node scripts/desktop.mjs build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spectrum-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

      # a TeX for the backend's compile tests. The packages the tests use are installed first: installed as they're
      # asked for, two test files compiling at once could each find one half installed and make no PDF. Anything
      # else is still installed when asked for. Each download is tried three times, as miktex.org sometimes times out;
      # if it stays down, TeX Live from CTAN instead (it installs nothing when asked for, so a few more packages)
      - name: MiKTeX
        run: |
          function Retry([scriptblock]$step) {
            foreach ($try in 1..3) {
              & $step | Out-Host
              if (!$LASTEXITCODE) { return $true }
              if ($try -lt 3) { Write-Host "Exit code $LASTEXITCODE, trying again in a minute"; Start-Sleep 60 }
            }
            $false
          }
          $packages = 'latexmk', 'standalone', 'xkeyval', 'currfile', 'filemod', 'gincltex', 'adjustbox', 'collectbox',
            'pgf', 'pgfplots', 'circuitikz', 'float', 'natbib', 'biblatex', 'glossaries', 'import', 'etoolbox'
          # and what MiKTeX's basic set lacks that they use too (TeX Live has these in the collections below): hyperref's
          # helpers, biblatex's logreq, xcolor's table option, the precompiled preamble's mylatexformat and the Simple
          # document template's packages, which two test files compile at once. (--require installs those not installed
          # yet; --install stops at one that is)
          $miktex = 'kvsetkeys', 'kvdefinekeys', 'pdfescape', 'ltxcmds', 'infwarerr', 'hycolor', 'nameref', 'refcount',
            'gettitlestring', 'kvoptions', 'stringenc', 'intcalc', 'bitset', 'bigintcalc', 'rerunfilecheck', 'uniquecounter',
            'logreq', 'colortbl', 'mylatexformat', 'csquotes', 'biblatex-apa', 'xurl', 'geometry', 'parskip', 'babel-english',
            'microtype', 'cleveref'
          $bin = "$env:ProgramFiles\MiKTeX\miktex\bin\x64"
          if (Retry { choco install miktex --no-progress -y }) {
            & "$bin\initexmf.exe" --admin --set-config-value='[MPM]AutoInstall=1'
            & "$bin\initexmf.exe" --set-config-value='[MPM]AutoInstall=1'
            if ((Retry { & "$bin\mpm.exe" --admin --update-db }) -and
                (Retry { & "$bin\mpm.exe" --admin @($packages + $miktex | ForEach-Object { "--require=$_" }) })) {
              Add-Content $env:GITHUB_PATH $bin
              exit 0
            }
          }

          Write-Host '::warning::MiKTeX could not be installed, so the tests use TeX Live'
          $tl = 'C:/texlive'
          $zip = "$env:RUNNER_TEMP\install-tl.zip"
          if (!(Retry { curl.exe -fsSL --retry 3 -o $zip https://mirror.ctan.org/systems/texlive/tlnet/install-tl.zip })) { exit 1 }
          Expand-Archive $zip "$env:RUNNER_TEMP\install-tl"
          $installer = (Get-ChildItem "$env:RUNNER_TEMP\install-tl" -Directory | Select-Object -First 1).FullName
          @(
            'selected_scheme scheme-basic', "TEXDIR $tl", "TEXMFLOCAL $tl/texmf-local", "TEXMFSYSVAR $tl/texmf-var",
            "TEXMFSYSCONFIG $tl/texmf-config", "TEXMFVAR $tl/texmf-var", "TEXMFCONFIG $tl/texmf-config", "TEXMFHOME $tl/texmf-home",
            'instopt_adjustpath 0', 'tlpdbopt_install_docfiles 0', 'tlpdbopt_install_srcfiles 0'
          ) | Set-Content "$env:RUNNER_TEMP\texlive.profile"
          if (!(Retry { & "$installer\install-tl-windows.bat" -no-gui -profile "$env:RUNNER_TEMP\texlive.profile" })) { exit 1 }
          $bin = (Get-ChildItem "$tl\bin" -Directory | Select-Object -First 1).FullName
          # what MiKTeX would install when asked for: biber and the packages these need
          $more = 'collection-latexrecommended', 'biber', 'xstring', 'mfirstuc', 'xfor', 'datatool', 'logreq', 'tracklang',
            'csquotes', 'biblatex-apa', 'xurl', 'greek-fontenc', 'cbfonts', 'cbfonts-fd', 'vntex', 'mylatexformat', 'cleveref'
          if (!(Retry { & "$bin\tlmgr.bat" install @($packages + $more) })) { exit 1 }
          Add-Content $env:GITHUB_PATH $bin

      # the installer build put Typst beside the other sidecars: a copy named typst.exe, with the vcruntime140.dll the
      # installer puts beside the app's, runs as the app's will (GITHUB_PATH reaches the next steps, not this one)
      - name: Typst
        run: |
          $bin = "$env:GITHUB_WORKSPACE\src-tauri\binaries"
          Copy-Item "$bin\typst-x86_64-pc-windows-msvc.exe" "$bin\typst.exe" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\src-tauri\resources\engines\vcruntime140.dll" $bin -Force
          Add-Content $env:GITHUB_PATH $bin
          & "$bin\typst.exe" --version

      # these two run after a failed set-up step too, so the tests still report
      # latexmk needs Perl (Strawberry Perl comes with the runner)
      - name: TeX tools
        if: ${{ !cancelled() }}
        run: |
          Get-Command pdflatex, latexmk, biber, typst -ErrorAction SilentlyContinue | Format-Table Name, Source
          perl -v

      - name: Backend tests
        if: ${{ !cancelled() }}
        # a hang fails this step alone, so the steps below still run
        timeout-minutes: 30
        env:
          # Hunspell and Harper as the installer has them
          SPECTRUM_NATIVE_DIR: ${{ github.workspace }}\src-tauri\resources\native
        run: npm test

      # MiKTeX names why it stopped only in its own logs, which a failed compile test points to
      - name: MiKTeX's logs
        if: ${{ failure() }}
        run: |
          foreach ($dir in "$env:LOCALAPPDATA\MiKTeX\miktex\log", "$env:ProgramData\MiKTeX\miktex\log") {
            Get-ChildItem $dir -Filter 'pdflatex*.log' -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "== $($_.FullName)"
              # a pass from the precompiled preamble, and what MiKTeX said of it
              Select-String -Path $_.FullName -Pattern 'fmt=' -Context 0,20 | Select-Object -First 2 | ForEach-Object { $_.Line; $_.Context.PostContext }
              Get-Content $_.FullName -Tail 15
            }
          }

      # the steps below run after a failed one too, so one run reports everything (the attach job still needs them all)
      # the LPAC tests, which the suite skips without this; they have only been run by hand, so they may fail
      - name: Native agent tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: apps/backend
        env:
          SPECTRUM_NATIVE_AGENT_TESTS: '1'
        run: node --test test/agent-windows.test.js test/agent-preview.test.js test/mcp-tools.test.js

      - name: Spelling and grammar checkers
        if: ${{ !cancelled() }}
        env:
          SPECTRUM_NATIVE_DIR: ${{ github.workspace }}\src-tauri\resources\native
        run: npm run checkers:verify

      - if: ${{ !cancelled() }}
        run: npm run typecheck

      # bundled as ESM, as they are on a Mac (some use top-level await), and run from the repository root, where the
      # checks that read files look for them
      - name: Frontend checks
        if: ${{ !cancelled() }}
        run: |
          $out = "$env:RUNNER_TEMP\check.mjs"
          foreach ($check in Get-ChildItem apps/frontend/src -Recurse -Filter *.check.ts) {
            npx esbuild $check.FullName --bundle --platform=node --format=esm --loader:.svg=text --loader:.css=empty --log-level=warning "--outfile=$out"
            if ($LASTEXITCODE) { throw "esbuild couldn't bundle $($check.Name)" }
            node $out
            if ($LASTEXITCODE) { throw "$($check.Name) failed" }
          }

      - name: Shell tests
        if: ${{ !cancelled() }}
        working-directory: src-tauri
        run: cargo test

  attach:
    needs: windows
    if: inputs.release_tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spectrum-windows-x64
      # TexLab's source (GPL 3.0), to go with the TexLab both installers carry; the digest is desktop.mjs's
      - run: |
          curl -fsSL -o texlab-5.26.0-source.tar.gz https://github.com/latex-lsp/texlab/archive/refs/tags/v5.26.0.tar.gz
          echo "47af7e71247fe186ddbaa62373ce5fbebc802ab8df9924958ac62788a644f84e  texlab-5.26.0-source.tar.gz" | sha256sum -c
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" ./*.exe ./texlab-5.26.0-source.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

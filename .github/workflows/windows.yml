# Builds and tests the Windows (x64) app, and can attach its installer to a release.
#   push to windows-port            build and test; the installer is a workflow artifact
#   Run workflow, release_tag v1.5.0  also uploads the installer to that release
name: Windows

on:
  push:
    branches: [windows-port]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release to attach the installer to, e.g. v1.5.0 (empty to only build)
        required: false
        default: ''

# the build runs third-party code (npm install scripts, node-gyp, crates' build scripts), so it can only read;
# the attach job, which runs none of it, is the only one that can write to a release
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      # the dictionaries and templates ship as they are in the repo, with LF line endings
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # the whole history, so the rollback test finds 1.10.4's commit rather than skipping
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # rustup comes with the runner
      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Visual Studio's C++ tools and Python come with the runner. Without the Hunspell binding the
      # installer still builds (no spell checker), but a release run fails instead of attaching it.
      - name: Spell checker (Hunspell)
        continue-on-error: ${{ !inputs.release_tag }}
        run: node scripts/native.mjs hunspell

      # built from its tagged source with the C runtime linked in, which takes a while, so kept between runs: saved as
      # soon as it's built, as the whole cache action saves only when every later step passes
      - id: texlab-cache
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\spectrum-build\texlab-5.26.0-x64
          key: texlab-5.26.0-x64-crt-static

      - name: TexLab
        run: node scripts/desktop.mjs texlab

      - if: steps.texlab-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~\AppData\Local\spectrum-build\texlab-5.26.0-x64
          key: texlab-5.26.0-x64-crt-static

      - name: Installer
        run: node scripts/desktop.mjs build

      - uses: actions/upload-artifact@v5
        with:
          name: spectrum-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

      # a TeX for the backend's compile tests. The packages the tests use are installed first: installed as they're
      # asked for, two test files compiling at once could each find one half installed and make no PDF. Anything
      # else is still installed when asked for.
      - name: MiKTeX
        run: |
          choco install miktex --no-progress -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bin = "$env:ProgramFiles\MiKTeX\miktex\bin\x64"
          & "$bin\initexmf.exe" --admin --set-config-value='[MPM]AutoInstall=1'
          & "$bin\initexmf.exe" --set-config-value='[MPM]AutoInstall=1'
          $packages = 'latexmk', 'standalone', 'xkeyval', 'currfile', 'filemod', 'gincltex', 'adjustbox', 'collectbox',
            'pgf', 'pgfplots', 'circuitikz', 'float', 'natbib', 'biblatex', 'glossaries', 'import', 'etoolbox'
          & "$bin\mpm.exe" --admin --update-db
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin\mpm.exe" --admin @($packages | ForEach-Object { "--install=$_" })
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_PATH $bin

      # the installer build put Typst beside the other sidecars: a copy named typst.exe, with the vcruntime140.dll the
      # installer puts beside the app's, runs as the app's will (GITHUB_PATH reaches the next steps, not this one)
      - name: Typst
        run: |
          $bin = "$env:GITHUB_WORKSPACE\src-tauri\binaries"
          Copy-Item "$bin\typst-x86_64-pc-windows-msvc.exe" "$bin\typst.exe" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\src-tauri\resources\engines\vcruntime140.dll" $bin -Force
          Add-Content $env:GITHUB_PATH $bin
          & "$bin\typst.exe" --version

      # these two run after a failed set-up step too, so the tests still report
      # latexmk needs Perl (Strawberry Perl comes with the runner)
      - name: TeX tools
        if: ${{ !cancelled() }}
        run: |
          Get-Command pdflatex, latexmk, biber, typst -ErrorAction SilentlyContinue | Format-Table Name, Source
          perl -v

      - name: Backend tests
        if: ${{ !cancelled() }}
        # a hang fails this step alone, so the steps below still run
        timeout-minutes: 30
        env:
          # Hunspell and Harper as the installer has them
          SPECTRUM_NATIVE_DIR: ${{ github.workspace }}\src-tauri\resources\native
        run: npm test

      # the steps below run after a failed one too, so one run reports everything (the attach job still needs them all)
      # the LPAC tests, which the suite skips without this; they have only been run by hand, so they may fail
      - name: Native agent tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: apps/backend
        env:
          SPECTRUM_NATIVE_AGENT_TESTS: '1'
        run: node --test test/agent-windows.test.js test/agent-preview.test.js test/mcp-tools.test.js

      - name: Spelling and grammar checkers
        if: ${{ !cancelled() }}
        env:
          SPECTRUM_NATIVE_DIR: ${{ github.workspace }}\src-tauri\resources\native
        run: npm run checkers:verify

      - if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Frontend checks
        if: ${{ !cancelled() }}
        run: |
          $out = "$env:RUNNER_TEMP\check.cjs"
          foreach ($check in Get-ChildItem apps/frontend/src -Recurse -Filter *.check.ts) {
            npx esbuild $check.FullName --bundle --platform=node --log-level=warning "--outfile=$out"
            if ($LASTEXITCODE) { throw "esbuild couldn't bundle $($check.Name)" }
            node $out
            if ($LASTEXITCODE) { throw "$($check.Name) failed" }
          }

      - name: Shell tests
        if: ${{ !cancelled() }}
        working-directory: src-tauri
        run: cargo test

  attach:
    needs: windows
    if: inputs.release_tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: spectrum-windows-x64
      # TexLab's source (GPL 3.0), to go with the TexLab both installers carry; the digest is desktop.mjs's
      - run: |
          curl -fsSL -o texlab-5.26.0-source.tar.gz https://github.com/latex-lsp/texlab/archive/refs/tags/v5.26.0.tar.gz
          echo "47af7e71247fe186ddbaa62373ce5fbebc802ab8df9924958ac62788a644f84e  texlab-5.26.0-source.tar.gz" | sha256sum -c
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" ./*.exe ./texlab-5.26.0-source.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

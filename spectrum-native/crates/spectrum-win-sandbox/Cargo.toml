[package]
name = "spectrum-win-sandbox"
description = "Windows AppContainer, low-integrity and job object worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true

# what the Windows escape tests run inside the sandbox; never shipped
[[bin]]
name = "spectrum-win-sandbox-probe"
path = "tests/support/probe.rs"
test = false
doctest = false

[lints]
workspace = true

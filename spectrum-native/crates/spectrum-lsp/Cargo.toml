[package]
name = "spectrum-lsp"
description = "JSON-RPC client for TexLab and Tinymist."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["process", "io-util", "rt", "rt-multi-thread", "sync", "time", "macros"] }
tempfile.workspace = true

# a stand-in language server for the restart tests; never shipped
[[bin]]
name = "spectrum-lsp-fake"
path = "tests/support/fake_lsp.rs"
test = false
doctest = false

[lints]
workspace = true

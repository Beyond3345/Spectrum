[package]
name = "spectrum-app"
description = "Spectrum: windows, menus, Tokio bridge and workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
gpui-kit.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros"] }
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
spectrum-core.workspace = true
spectrum-compile.workspace = true
spectrum-lsp.workspace = true
spectrum-checkers.workspace = true
spectrum-ai.workspace = true
spectrum-references.workspace = true
spectrum-git.workspace = true
spectrum-convert.workspace = true
spectrum-theme.workspace = true
spectrum-ui.workspace = true
spectrum-editor.workspace = true
spectrum-pdf.workspace = true
spectrum-diagram.workspace = true
trash.workspace = true

[dev-dependencies]
tempfile.workspace = true
# real offscreen rendering for snapshot tests (tests/snapshot.rs)
gpui-kit = { workspace = true, features = ["test-support"] }
image.workspace = true

# the Mac platform must start on the main thread, which libtest doesn't give tests
[[test]]
name = "snapshot"
harness = false

[lints]
workspace = true

[[bin]]
name = "spectrum"
path = "src/main.rs"

[package]
name = "spectrum"
version = "1.2.0"
description = "Spectrum: a local LaTeX + AI writing workspace for macOS"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde_json = "1"

# the window's full screen notifications (main.rs); already in the tree through tao and wry
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSNotification", "NSOperation", "NSString"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
